services:
  init_permissions:
    volumes: !override
      - emotion_dog_storage:/app/api/storage
  api:
    volumes: !override
      - emotion_dog_storage:/app/api/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker:
    volumes: !override
      - emotion_dog_storage:/app/api/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker_beat:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  ssrf_proxy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SSRF_PROXY_ALLOW_PRIVATE_IPS: "172.17.0.1/32"
  plugin_daemon:
    volumes: !override
      - emotion_dog_plugin_storage:/app/storage
    ports: !override
      - "127.0.0.1:5003:5003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db_postgres:
    volumes: !override
      - emotion_dog_postgres:/var/lib/postgresql/data
  redis:
    volumes: !override
      - emotion_dog_redis:/data
  weaviate:
    volumes: !override
      - emotion_dog_weaviate:/var/lib/weaviate
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
volumes:
  emotion_dog_storage:
  emotion_dog_plugin_storage:
  emotion_dog_postgres:
  emotion_dog_redis:
  emotion_dog_weaviate:

